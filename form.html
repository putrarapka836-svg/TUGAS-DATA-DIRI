<html>
<head>
<title>Form Pendaftara</title>
</head>
<body>
<h2>Form Pendaftaran</h2>
<form>
<table>
<tr>
<td><label>Nama Lengkap</label></td>
<td>:</td>
<td><input type="text" required /></td>
</tr>
<tr>
<td> <label>No HP</label></td>
<td>:</td>
<td> <input type="number" required placeholder="Masukkan Angka"></td>
</tr>
<tr></tr>
</table>
<label>Email</label>
<input type="email" required placeholder="Masukkan Email"><br>
<label>Password</label>
<input type="password"><br>
<label>Tanggal Lahir</label>
<input type="date"><br>
<label>Jenis Kelamin</label>
<input type="radio" name="jenisKelamin" value="Laki-Laki">Laki-Laki
<input type="radio" name="jenisKelamin" value="Perempuan">Perempuan<br>
<label>Hobi</label><br>
<input type="checkbox" name="hobi" value="membaca">Membaca<br>
<input type="checkbox" name="hobi" value="menulis">Menulis<br>
<input type="checkbox" name="hobi" value="Olahraga">Olahraga<br>
<input type="checkbox" name="hobi" value="Seni Tari">Seni Tari<br>
<label>Alamat</label>
<textarea placeholder="Masukkan Alamat"></textarea><br>
<label>Jurusan</label>
<select id="jurusan" name="jurusan">
<option value="rpl">RPL</option>
<option value="tkj">TKJ</option>
<option value="pg">PG</option>
</select><br>
<label>Foto</label>
<input type="file"><br>
<input type="submit"><br>
</form>
 </body>
 </html>
